<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tomato timer</title>
        <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">

        <style>
            body {
                margin: 0 auto;
                padding: 0 16px;
                text-align: center;
                font-family: "M PLUS Rounded 1c", sans-serif;
            }
            h1 {
                font-size: 20vw;
                margin: 0px;
                padding: 0px;
                line-height: 1;
            }
            h2 {
                margin: 2px;
            }
            h3 {
                font-size: 4vw;
                margin: 5px;
            }
            button {
                background-color: #ffcf7f;
                padding: 10px 20px;
                border-radius: 8px;
            }
            #settingButton {
                position: relative;
            }
        </style>
    </head>

    <body>

        <h2>ポモドーロタイマー</h2>
        <h2 id="nowMode">集中時間</h2>
        <h1 id="displayTime">25:00</h1>
        <h3 id="nowTime" style="color: #009fbf;">[日付表示]</h3>
        <button id="timerButton" onclick="distimerClick()">タイマー表示</button>
        <button id="settingButton" onclick="settingOpen()">設定変更する</button>
        <button id="modeButton" onclick="modeClick()">開始・停止ボタン</button>

        <dialog id="setting">
            <p>集中時間：</p>
            <input id="workTimeInput" type="number">
            <p>通常の休憩：</p>
            <input id="normalBreakTimeInput" type="number">
            <p>長めの休憩：</p>
            <input id="longBreakTimeInput" type="number">
            <p>休憩の周期：</p>
            <input id="breakTimeCycleInput" type="number">
            <button onclick="settingClose()">閉じる</button>
        </dialog>


        <script>
            //変数省略形 N=now T=template

            let NYear;
            let NMonth;
            let NDate;
            let NHours;
            let NMinutes;
            let NSeconds;
            let TDays = ["日曜日", "月曜日", "火曜日", "水曜日", "木曜日", "金曜日", "土曜日" ];
            let NDay;
            let today;
            let nowTime;
            let displayingTimer = true;
            let counting = false;
            let nowMode = 0;//0:勉強待機 1:勉強中 2:休憩待機 3:休憩 4:長い休憩待機 5:長い休憩
            let workTime = 25;
            let normalBreakTime = 5;
            let longBreakTime = 15;
            let cycleNumber = 4;
            let nowCycleNumber = 0;
            let tmpTimer;
            let tmpmin;
            let tmpsec;
            let displayTimer;
            let startTime;//開始時刻
            let limitTime;//制限時間
            let totalWorkTime;

            timerUpdate();

            window.addEventListener("DOMContentLoaded", function() {
                setInterval(function() {
                    if (Number(NSeconds) !== new Date().getSeconds()) {
                        NYear    = new Date().getFullYear();                        
                        NMonth   = String(new Date().getMonth() + 1).padStart(2,"0");
                        NDate    = String(new Date().getDate()).padStart(2,"0");    
                        NHours   = String(new Date().getHours()).padStart(2,"0");   
                        NMinutes = String(new Date().getMinutes()).padStart(2,"0"); 
                        NSeconds = String(new Date().getSeconds()).padStart(2,"0"); 
                        NDay     = TDays[new Date().getDay()];  
                        today    = NYear + "/" + NMonth + "/" + NDate + "(" + NDay + ")";
                        nowTime  = NHours + ":" + NMinutes + ":" + NSeconds
                        
                        if (counting === true) {
                            tmpTimer = limitTime - Math.floor((new Date() - startTime) / 1000)
                            tmpmin = String(Math.floor(tmpTimer / 60)).padStart(2,"0");
                            tmpsec = String(tmpTimer % 60).padStart(2,"0");
                            displayTimer = tmpmin + ":" + tmpsec;
                        }


                        if (displayingTimer === true) {
                            if (nowMode % 2 === 0) {
                                document.getElementById("displayTime").textContent = String(Math.floor(limitTime / 60)).padStart(2,"0") + ":" + String (limitTime % 60).padStart(2,"0");
                            } else {
                                document.getElementById("displayTime").textContent = displayTimer;
                            }
                            document.getElementById("nowTime").textContent = today + nowTime;
                        } else {
                            document.getElementById("displayTime").textContent = nowTime;
                            document.getElementById("nowTime").textContent = today;
                        }
                            
                    }
                })
            });

            function distimerClick() {
                if (displayingTimer === true) {
                    displayingTimer = false;
                    document.getElementById("displayTime").style.color = "#009fbf";
                } else {
                    displayingTimer = true;
                    document.getElementById("displayTime").style.color = "black";
                }
            }


            function timerUpdate() {
                if (nowMode === 0) {
                    limitTime = workTime * 60;
                }
                if (nowMode === 2) {
                    limitTime = normalBreakTime * 60;
                }
                if (nowMode === 4) {
                    limitTime = longBreakTime * 60;
                }
                if (nowMode % 2 === 0) {
                    tmpTimer = limitTime - ((new Date() - startTime) / 1000)
                    tmpmin = String(Math.floor(tmpTimer / 60)).padStart(2,"0");
                    tmpsec = String(tmpTimer % 60).padStart(2,"0");
                    displayTimer = tmpmin + ":" + tmpsec;
                    if (displayingTimer === true) {
                        document.getElementById("displayTime").textContent = String(Math.floor(limitTime / 60)).padStart(2,"0") + ":" + String (limitTime % 60).padStart(2,"0");
                    }
                }
            }

            function settingOpen() {
                document.getElementById("setting").showModal();
                document.getElementById("workTimeInput").value = workTime
                document.getElementById("normalBreakTimeInput").value = normalBreakTime
                document.getElementById("longBreakTimeInput").value = longBreakTime
                document.getElementById("breakTimeCycleInput").value = cycleNumber
            }

            function settingClose() {
                document.getElementById("setting").close();
                workTime        = document.getElementById("workTimeInput").value.trim();
                normalBreakTime = document.getElementById("normalBreakTimeInput").value.trim();
                longBreakTime   = document.getElementById("longBreakTimeInput").value.trim();
                cycleNumber     = document.getElementById("breakTimeCycleInput").value.trim();
                timerUpdate();
            }

            function modeClick() {
                if (nowMode === 0) {
                    nowCycleNumber++;
                    nowMode = 1;
                    tmpTimer = workTime * 60;


                } else if (nowMode === 1) {
                    totalWorkTime = ((new Date() - startTime) / 1000);
                    if (nowCycleNumber % cycleNumber === 0) {
                        nowMode = 4;
                        tmpTimer = longBreakTime * 60;
                        document.getElementById("nowMode").textContent = "長い休憩";
                    } else {
                        nowMode = 2;
                        tmpTimer = normalBreakTime * 60;
                        document.getElementById("nowMode").textContent = "休憩";
                    }
                    counting = false;


                } else if (nowMode === 2) {
                    nowMode = 3;


                } else if (nowMode === 4) {
                    nowMode = 5;


                } else if (nowMode === 3 || nowMode === 5) {
                    nowMode = 0;
                    tmpTimer = workTime * 60;
                    document.getElementById("nowMode").textContent = "集中時間";
                    counting = false;
                }
                if (nowMode % 2 === 1) {
                    counting = true;
                    startTime = new Date();
                }
                timerUpdate();
            }


        </script>
    </body>
</html>
